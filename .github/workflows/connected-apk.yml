name: connected-preview-apk

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Public HTTPS API URL ending in /api/v1
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AI_FITNESS_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and probe API
        shell: bash
        run: |
          set -euo pipefail
          case "$AI_FITNESS_API_BASE_URL" in
            https://*/api/v1) ;;
            *) echo "api_base_url must be HTTPS and end in /api/v1" >&2; exit 1 ;;
          esac
          health_url="${AI_FITNESS_API_BASE_URL%/api/v1}/healthz"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$health_url"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install mobile dependencies
        run: ./scripts/ci-mobile-install.sh
      - name: Verify mobile and native contracts
        run: |
          cd apps/mobile
          npm run typecheck
          cd ../..
          python3 scripts/verify_android_native.py
      - name: Assemble connected preview APK
        working-directory: apps/mobile
        run: npm run android:assemble:internal
      - name: Upload connected APK
        uses: actions/upload-artifact@v4
        with:
          name: athletica-ai-connected-preview-apk
          path: apps/mobile/android/app/build/outputs/apk/internal/app-internal.apk
          if-no-files-found: error
          retention-days: 14
