name: release-gate

on:
  push:
  pull_request:

jobs:
  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate staging Compose and TLS proxy contract
        run: |
          ./scripts/verify-staging-deploy.sh
          ./scripts/verify-railway-deploy.sh
      - name: Build Railway API image
        run: docker build -f services/api/Dockerfile -t athletica-api:railway .

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness
          POSTGRES_DB: fitness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: fitness
      POSTGRES_TEST_DSN: postgres://fitness:fitness@127.0.0.1:5432/fitness?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.mod
      - name: Install PostgreSQL client/libpq
        run: sudo apt-get update && sudo apt-get install -y postgresql-client libpq-dev
      - name: Migration up/down/up smoke
        run: ./scripts/postgres-migration-smoke.sh
      - name: Railway DATABASE_URL migration runner
        env:
          DATABASE_URL: ${{ env.POSTGRES_TEST_DSN }}
          MIGRATIONS_DIR: ${{ github.workspace }}/services/api/migrations
        run: ./services/api/migrations/run.sh
      - name: Go release gate + PostgreSQL integration
        working-directory: services/api
        run: go test -race -p=1 ./...
      - name: Non-CGO portability gate
        working-directory: services/api
        env:
          CGO_ENABLED: 0
        run: go test ./...
      - name: Vet
        working-directory: services/api
        run: go vet ./...

  static-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript verifier
        run: npm install --global typescript@6.0.3
      - name: Mobile syntax and runtime regressions
        run: |
          node scripts/verify-mobile-syntax.mjs
          node scripts/test-mobile-auth-refresh.mjs
          node scripts/test-mobile-session-scope.mjs
          node scripts/test-mobile-technique-mapping.mjs
          node scripts/test-mobile-technique-readiness.mjs
          node scripts/test-mobile-body-scan.mjs
          node scripts/test-mobile-health-passive-sync.mjs
          node scripts/test-mobile-core-screens.mjs
          node scripts/test-mobile-analytics-races.mjs
          node scripts/test-mobile-home-reliability.mjs
          node scripts/test-mobile-nutrition-regressions.mjs
          node scripts/test-mobile-rest-timer.mjs
          node scripts/test-mobile-program-resume.mjs
          node scripts/test-mobile-nutrition-calendar.mjs
          node scripts/test-mobile-food-idempotency.mjs
          node scripts/test-mobile-devices-status.mjs
          node scripts/test-mobile-device-display.mjs
          node scripts/test-mobile-design-accessibility.mjs

  android-internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install stable Android SDK/NDK required by RN 0.87
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install mobile dependencies
        run: ./scripts/ci-mobile-install.sh
      - name: Mobile async behavior regressions
        run: |
          node apps/mobile/src/screens/ActiveWorkoutScreen.test.mjs
          node apps/mobile/src/storage/offlineQueue.test.mjs
      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Generate React Native Codegen
        working-directory: apps/mobile
        run: npm run android:codegen
      - name: Assemble standalone internal APK
        working-directory: apps/mobile
        run: npm run android:assemble:internal
      - name: Upload standalone internal APK
        uses: actions/upload-artifact@v4
        with:
          name: athletica-ai-internal-apk
          path: apps/mobile/android/app/build/outputs/apk/internal/app-internal.apk
