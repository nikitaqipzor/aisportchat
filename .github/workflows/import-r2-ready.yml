name: import-r2-ready-archive

on:
  push:
    branches:
      - recovery/r2-clean-restart-2
    paths:
      - '.recovery-upload/ready'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/r2-clean-restart-2
          fetch-depth: 0
      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery-upload/chunks/part-*.b64 | base64 -d > /tmp/aisportchat-r2-ready-to-push.zip
          echo '42c58096cf9738f31b20dc9ddc610730814d652d66c752bff6781ede784392ae  /tmp/aisportchat-r2-ready-to-push.zip' | sha256sum -c -
      - name: Restore source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aisportchat-r2
          unzip -q /tmp/aisportchat-r2-ready-to-push.zip -d /tmp/aisportchat-r2
          test -f /tmp/aisportchat-r2/aisportchat-r2-ready/README.md
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/aisportchat-r2/aisportchat-r2-ready/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'recovery: import AI Fitness OS Sprint 4C R2'
          git push origin HEAD:recovery/r2-clean-restart-2
