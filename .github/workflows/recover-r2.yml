name: restore-r2-source

on:
  push:
    branches:
      - recovery/sprint-4c-r2
    paths:
      - '.recovery/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/sprint-4c-r2
          fetch-depth: 0

      - name: Reassemble Sprint 4C R2 archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .recovery/chunks
          test "$(find .recovery/chunks -type f -name 'chunk-*' | wc -l)" -eq 54
          cat $(find .recovery/chunks -type f -name 'chunk-*' | sort) | base64 -d > /tmp/r2-recovery.tar.gz
          echo '06e12e34cb25dbb314d4c4b4ab88829c6320dd08037fd2af1b686997f71fb958  /tmp/r2-recovery.tar.gz' | sha256sum -c -

      - name: Restore Sprint 4C R2 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/r2-restore
          mkdir -p /tmp/r2-restore
          tar -xzf /tmp/r2-recovery.tar.gz -C /tmp/r2-restore

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .recovery -exec rm -rf {} +
          cp -a /tmp/r2-restore/. .
          rm -rf .recovery
          rm -f .github/workflows/recover-r2.yml

          cat > .gitignore <<'EOF'
          # Dependencies/build output
          node_modules/
          dist/
          build/
          .gradle/
          apps/mobile/android/.cxx/
          apps/mobile/android/app/build/
          apps/mobile/android/build/

          # Local environment/secrets
          .env
          .env.*
          !.env.example
          *.jks
          *.keystore
          !apps/mobile/android/app/debug.keystore
          keystore.properties
          local.properties

          # OS/editor
          .DS_Store
          .idea/
          .vscode/
          *.swp
          EOF

      - name: Sanity-check restored project
        shell: bash
        run: |
          set -euo pipefail
          test -d apps/mobile
          test -d services/api
          test -d packages
          test -d infra
          test -d docs
          test -f .github/workflows/ci.yml
          test -f apps/mobile/android/gradle/wrapper/gradle-wrapper.jar
          echo "Restored file count: $(find . -type f ! -path './.git/*' | wc -l)"

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'recovery: restore AI Fitness OS Sprint 4C R2 source'
          git push origin HEAD:recovery/sprint-4c-r2
