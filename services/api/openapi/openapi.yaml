openapi: 3.1.0
info:
  title: AI Fitness OS API
  version: 1.6.1
servers:
- url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: User registered
        '409':
          description: Email already exists
        '429':
          description: Too many registration attempts; Retry-After header is set
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Logged in
        '401':
          description: Invalid credentials
        '429':
          description: Too many login attempts; Retry-After header is set
  /auth/refresh:
    post:
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Rotated token pair
        '401':
          description: Invalid refresh token
        '429':
          description: Too many refresh attempts; Retry-After header is set
  /auth/logout:
    post:
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '204':
          description: Logged out
  /profile:
    get:
      operationId: getProfile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: User fitness profile
    patch:
      operationId: updateProfile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
      responses:
        '200':
          description: Updated profile
  /profile/goal:
    put:
      operationId: setGoal
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalRequest'
      responses:
        '200':
          description: Updated goal
  /profile/training-preferences:
    put:
      operationId: setTrainingPreferences
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingPreferencesRequest'
      responses:
        '200':
          description: Updated training preferences
  /onboarding/status:
    get:
      operationId: getOnboardingStatus
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Onboarding state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
  /onboarding/complete:
    post:
      operationId: completeOnboarding
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Onboarding completed
        '409':
          description: Required onboarding data missing
  /muscles:
    get:
      operationId: listMuscles
      responses:
        '200':
          description: Muscle catalog
  /muscles/{muscle_id}/stats:
    get:
      operationId: getMuscleStats
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: muscle_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Aggregated training history for a muscle group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MuscleStats'
        '422':
          description: Unknown muscle
  /equipment:
    get:
      operationId: listEquipment
      responses:
        '200':
          description: Equipment catalog
  /recovery/today:
    get:
      operationId: getReadiness
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Deterministic daily readiness and per-muscle recovery status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /recovery/timeline:
    get:
      operationId: getReadinessTimeline
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Deterministic explanation of readiness factor changes and workout adaptation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessTimeline'
  /recovery/check-in:
    put:
      operationId: saveRecoveryCheckIn
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryCheckInRequest'
      responses:
        '200':
          description: Check-in saved and readiness recalculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /recovery/history:
    get:
      operationId: listRecoveryCheckIns
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 90
          default: 30
      responses:
        '200':
          description: Recovery check-in history
  /workouts/generate:
    post:
      operationId: generateWorkout
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateWorkoutRequest'
      responses:
        '201':
          description: Generated and persisted planned workout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutView'
        '422':
          description: Workout cannot be generated
  /workouts/active:
    get:
      operationId: getActiveWorkout
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current active workout, used to restore a session after app
            restart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutView'
        '204':
          description: User has no active workout
  /workouts/history:
    get:
      operationId: workoutHistory
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - in: query
        name: muscle
        schema:
          type: string
      - in: query
        name: environment
        schema:
          type: string
          enum:
          - home
          - gym
          - band
      - in: query
        name: status
        schema:
          type: string
          enum:
          - planned
          - active
          - completed
          - cancelled
      - in: query
        name: favorite
        schema:
          type: boolean
      responses:
        '200':
          description: User workout history
  /records:
    get:
      operationId: listPersonalRecords
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Personal-record event history
  /workouts/{workout_id}:
    get:
      operationId: getWorkout
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkoutId'
      responses:
        '200':
          description: Workout details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutView'
        '404':
          description: Workout not found
  /workouts/{workout_id}/favorite:
    patch:
      operationId: setWorkoutFavorite
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - favorite
              properties:
                favorite:
                  type: boolean
      responses:
        '200':
          description: Favorite flag updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutView'
  /workouts/{workout_id}/repeat:
    post:
      operationId: repeatWorkout
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkoutId'
      responses:
        '201':
          description: New planned workout copied from a completed workout with current
            progression targets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutView'
        '422':
          description: Source workout is not repeatable
  /workouts/{workout_id}/start:
    post:
      operationId: startWorkout
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkoutId'
      responses:
        '200':
          description: Workout started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutView'
        '409':
          description: Invalid workout state
  /workouts/{workout_id}/sets:
    put:
      operationId: logWorkoutSet
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkoutId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInput'
      responses:
        '200':
          description: Set saved; repeated set number updates the same set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutView'
        '409':
          description: Workout is not active
        '422':
          description: Invalid set values
  /workouts/{workout_id}/exercises/{workout_exercise_id}/replace:
    post:
      operationId: replaceWorkoutExercise
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkoutId'
      - in: path
        name: workout_exercise_id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: busy
      responses:
        '200':
          description: Exercise replaced with a compatible alternative
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutView'
        '409':
          description: Exercise already has completed sets or workout is finished
  /workouts/{workout_id}/finish:
    post:
      operationId: finishWorkout
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkoutId'
      responses:
        '200':
          description: Workout completed with volume and next-session recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinishResult'
        '409':
          description: Workout is not active
  /workouts/{workout_id}/cancel:
    post:
      operationId: cancelWorkout
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/WorkoutId'
      responses:
        '200':
          description: Planned or active workout cancelled; linked program session
            becomes available again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutView'
        '409':
          description: Workout cannot be cancelled in its current state
  /programs/generate:
    post:
      operationId: generateProgram
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateProgramRequest'
      responses:
        '201':
          description: Deterministic 4/8/12-week program with deload calendar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingProgram'
        '422':
          description: Program cannot be generated from current profile/preferences
  /programs/active:
    get:
      operationId: getActiveProgram
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Active training program; overdue planned sessions are marked
            missed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingProgram'
        '204':
          description: No active program
  /programs/history:
    get:
      operationId: listPrograms
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Program history
  /programs/{program_id}:
    get:
      operationId: getProgram
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProgramId'
      responses:
        '200':
          description: Program and its calendar sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingProgram'
        '404':
          description: Program not found
  /programs/{program_id}/analytics:
    get:
      operationId: getProgramAnalytics
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProgramId'
      responses:
        '200':
          description: Adherence, current week, planned/completed volume and next
            session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramAnalytics'
  /programs/{program_id}/archive:
    post:
      operationId: archiveProgram
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProgramId'
      responses:
        '200':
          description: Program archived
  /programs/sessions/{session_id}/workout:
    post:
      operationId: createProgramSessionWorkout
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProgramSessionId'
      - in: query
        name: date
        schema:
          type: string
          format: date
        description: User-local date used to combine program and recovery adaptation
      responses:
        '201':
          description: Workout created and linked; program and readiness multipliers
            are applied to actual targets
        '200':
          description: Existing linked workout returned idempotently
  /programs/sessions/{session_id}/reschedule:
    post:
      operationId: rescheduleProgramSession
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProgramSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_date
              properties:
                new_date:
                  type: string
                  format: date-time
                reason:
                  type: string
      responses:
        '200':
          description: Session manually rescheduled
  /programs/sessions/{session_id}/auto-reschedule:
    post:
      operationId: autoRescheduleProgramSession
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProgramSessionId'
      responses:
        '200':
          description: Missed session moved to nearest free future day inside program
            horizon
  /programs/sessions/{session_id}/explain:
    post:
      operationId: explainProgramSessionAdaptation
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProgramSessionId'
      responses:
        '200':
          description: AI explanation of deterministic deload/reschedule decision
  /nutrition/profile:
    get:
      operationId: getNutritionProfile
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current nutrition target profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionProfile'
        '204':
          description: Nutrition has not been configured
    put:
      operationId: setNutritionProfile
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NutritionProfileInput'
      responses:
        '200':
          description: Calculated or manually configured nutrition targets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionProfile'
        '422':
          description: Invalid target configuration or body weight missing
  /nutrition/today:
    get:
      operationId: getNutritionDay
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Daily calorie and macro balance with food entries and training-day
            marker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionDay'
  /nutrition/history:
    get:
      operationId: getNutritionHistory
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          minimum: 1
          maximum: 90
          default: 7
      responses:
        '200':
          description: Daily nutrition summaries
  /nutrition/foods:
    get:
      operationId: searchFoods
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: query
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      responses:
        '200':
          description: Searchable food catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FoodItem'
  /nutrition/entries:
    post:
      operationId: logFoodEntry
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodEntryInput'
      responses:
        '201':
          description: Food logged and daily totals recalculated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionDay'
  /nutrition/entries/{entry_id}:
    delete:
      operationId: deleteFoodEntry
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: entry_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Food entry removed
        '404':
          description: Entry not found
  /nutrition/foods/custom:
    post:
      operationId: createCustomFood
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFoodInput'
      responses:
        '201':
          description: User-owned food created
  /nutrition/foods/barcode/{barcode}:
    get:
      operationId: foodByBarcode
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: barcode
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Global or user-owned food matching barcode
        '404':
          description: Barcode not found
  /nutrition/entries/{entry_id}/repeat:
    post:
      operationId: repeatFoodEntry
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: entry_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Previous food entry repeated
  /nutrition/recipes:
    get:
      operationId: listRecipes
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Saved user recipes
    post:
      operationId: createRecipe
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipeInput'
      responses:
        '201':
          description: Recipe created
  /nutrition/recipes/{recipe_id}/log:
    post:
      operationId: logRecipe
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: recipe_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Recipe items logged into the food diary
  /nutrition/correlation:
    get:
      operationId: nutritionTrainingCorrelation
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          minimum: 1
          maximum: 180
          default: 30
      responses:
        '200':
          description: Aggregated nutrition comparison between training and rest days
  /progress/measurements:
    post:
      operationId: logBodyMeasurement
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyMeasurementInput'
      responses:
        '201':
          description: Body measurement saved
    get:
      operationId: listBodyMeasurements
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          minimum: 1
          maximum: 730
          default: 30
      responses:
        '200':
          description: Measurement history
  /progress/summary:
    get:
      operationId: progressSummary
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          minimum: 1
          maximum: 730
          default: 30
      responses:
        '200':
          description: Weight and circumference trend summary
  /ai/status:
    get:
      operationId: aiStatus
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Active AI provider and model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStatus'
  /ai/food/parse:
    post:
      operationId: aiParseFoodText
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  minLength: 2
                  maxLength: 2000
      responses:
        '200':
          description: AI draft matched against deterministic food catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIFoodDraft'
        '422':
          description: Food could not be parsed
  /ai/food/photo:
    post:
      operationId: aiParseFoodPhoto
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - image_data_url
              properties:
                image_data_url:
                  type: string
                  description: Data URL containing an image; endpoint body limit is
                    8 MiB
      responses:
        '200':
          description: Vision draft matched against deterministic food catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIFoodDraft'
        '422':
          description: Vision provider unavailable or food could not be detected
  /ai/food/confirm:
    post:
      operationId: aiConfirmFood
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIFoodConfirmRequest'
      responses:
        '201':
          description: User-confirmed foods logged using deterministic nutrition calculations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionDay'
  /ai/chat:
    post:
      operationId: aiCoach
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIChatRequest'
      responses:
        '200':
          description: AI Coach response with optional read-only tool calls
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIChatResponse'
  /ai/reports/weekly:
    get:
      operationId: aiWeeklyReport
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Narrative report over deterministic seven-day statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIWeeklyReport'
  /body-scans:
    post:
      operationId: createBodyScan
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Draft body scan created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyScanDetails'
    get:
      operationId: listBodyScans
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 50
      responses:
        '200':
          description: Body scan history
  /body-scans/comparison/latest:
    get:
      operationId: latestBodyScanComparison
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Capture consistency and measurement delta for latest two completed
            scans
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyScanComparison'
        '404':
          description: Fewer than two completed scans
  /body-scans/{scan_id}:
    get:
      operationId: getBodyScan
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: scan_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Body scan metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyScanDetails'
    delete:
      operationId: deleteBodyScan
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: scan_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Metadata and private body scan images deleted
  /body-scans/{scan_id}/photos/{view}:
    put:
      operationId: putBodyScanPhoto
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: scan_id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: view
        required: true
        schema:
          type: string
          enum:
          - front
          - side
          - back
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - image_data_url
              properties:
                image_data_url:
                  type: string
                  description: Base64 JPEG/PNG data URL
                  maxLength: 12000000
      responses:
        '200':
          description: Photo passed quality checks and was stored privately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyScanDetails'
        '400':
          description: Invalid
          dark: null
          overexposed: null
          low-resolution or landscape image: null
    get:
      operationId: getBodyScanPhoto
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: scan_id
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: view
        required: true
        schema:
          type: string
          enum:
          - front
          - side
          - back
      responses:
        '200':
          description: Private image bytes
  /body-scans/{scan_id}/complete:
    post:
      operationId: completeBodyScan
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: scan_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Scan completed after front/side/back are present
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyScanDetails'
        '400':
          description: Three accepted views are required
  /technique/exercises:
    get:
      operationId: techniqueExercises
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Supported exercise analyzers and current algorithm version
  /technique/analyses:
    post:
      operationId: analyzeTechnique
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TechniqueAnalyzeInput'
      responses:
        '201':
          description: Technique analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechniqueResult'
        '400':
          description: Unsupported exercise or insufficient pose quality
    get:
      operationId: techniqueHistory
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Recent technique analyses
  /technique/analyses/{analysis_id}:
    get:
      operationId: techniqueAnalysis
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: analysis_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Stored technique analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechniqueResult'
        '404':
          description: Analysis not found
  /health/snapshots:
    put:
      operationId: importHealthSnapshot
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthSnapshotInput'
      responses:
        '200':
          description: Health Connect daily snapshot imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDailySnapshot'
        '422':
          description: Invalid health snapshot
  /health/today:
    get:
      operationId: getHealthToday
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Imported daily health snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDailySnapshot'
        '204':
          description: No imported snapshot
  /health/history:
    get:
      operationId: listHealthHistory
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 90
          default: 14
      responses:
        '200':
          description: Health snapshot history
  /health/insights:
    get:
      operationId: getHealthInsights
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Personal 7/28-day wearable baselines, freshness and provenance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthInsights'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    WorkoutId:
      in: path
      name: workout_id
      required: true
      schema:
        type: string
        format: uuid
    ProgramId:
      in: path
      name: program_id
      required: true
      schema:
        type: string
        format: uuid
    ProgramSessionId:
      in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RecoveryCheckInRequest:
      type: object
      required:
      - date
      - sleep_hours
      - sleep_quality
      - energy
      - stress
      - muscle_soreness
      properties:
        date:
          type: string
          format: date
        sleep_hours:
          type: number
          minimum: 0
          maximum: 16
        sleep_quality:
          type: integer
          minimum: 1
          maximum: 5
        energy:
          type: integer
          minimum: 1
          maximum: 5
        stress:
          type: integer
          minimum: 1
          maximum: 5
        muscle_soreness:
          type: object
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 5
        notes:
          type: string
    RecoveryCheckIn:
      allOf:
      - $ref: '#/components/schemas/RecoveryCheckInRequest'
      - type: object
        required:
        - id
        - created_at
        - updated_at
        properties:
          id:
            type: string
            format: uuid
          created_at:
            type: string
            format: date-time
          updated_at:
            type: string
            format: date-time
    RecoveryMuscleStatus:
      type: object
      required:
      - muscle
      - score
      - status
      - soreness
      - recent_sets_7d
      - recent_sets_48h
      properties:
        muscle:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        status:
          type: string
          enum:
          - ready
          - moderate
          - fatigued
        soreness:
          type: integer
          minimum: 1
          maximum: 5
        recent_sets_7d:
          type: number
        recent_sets_48h:
          type: number
        hours_since_last_workout:
          type: integer
          minimum: 0
    ReadinessFactors:
      type: object
      required:
      - sleep
      - energy
      - stress
      - soreness
      - training_load
      properties:
        sleep:
          type: integer
          minimum: 0
          maximum: 100
        energy:
          type: integer
          minimum: 0
          maximum: 100
        stress:
          type: integer
          minimum: 0
          maximum: 100
        soreness:
          type: integer
          minimum: 0
          maximum: 100
        training_load:
          type: integer
          minimum: 0
          maximum: 100
    Readiness:
      type: object
      required:
      - date
      - check_in_completed
      - score
      - status
      - factors
      - volume_multiplier
      - intensity_multiplier
      - reasons
      - muscles
      properties:
        date:
          type: string
          format: date
        check_in_completed:
          type: boolean
        score:
          type: integer
          minimum: 0
          maximum: 100
        status:
          type: string
          enum:
          - ready
          - good
          - moderate
          - low
        factors:
          $ref: '#/components/schemas/ReadinessFactors'
        volume_multiplier:
          type: number
          minimum: 0.4
          maximum: 1.2
        intensity_multiplier:
          type: number
          minimum: 0.7
          maximum: 1.1
        reasons:
          type: array
          items:
            type: string
        muscles:
          type: array
          items:
            $ref: '#/components/schemas/RecoveryMuscleStatus'
        check_in:
          $ref: '#/components/schemas/RecoveryCheckIn'
        wearable:
          $ref: '#/components/schemas/HealthDailySnapshot'
        sleep_source:
          type: string
          enum:
          - none
          - check_in
          - wearable
        health_insights:
          $ref: '#/components/schemas/HealthInsights'
    ReadinessFactorImpact:
      type: object
      required: [key, label, today_score, weight, weighted_points, direction, message]
      properties:
        key:
          type: string
          enum: [sleep, energy, stress, soreness, training_load]
        label: {type: string}
        today_score: {type: integer, minimum: 0, maximum: 100}
        previous_score: {type: integer, minimum: 0, maximum: 100}
        weight: {type: number, minimum: 0, maximum: 1}
        weighted_points: {type: number}
        weighted_delta_points: {type: number}
        direction:
          type: string
          enum: [up, down, stable]
        message: {type: string}
    ReadinessAdaptationImpact:
      type: object
      required: [volume_multiplier, intensity_multiplier, volume_change_percent, intensity_change_percent]
      properties:
        volume_multiplier: {type: number}
        intensity_multiplier: {type: number}
        volume_change_percent: {type: integer}
        intensity_change_percent: {type: integer}
    ReadinessHealthTrend:
      type: object
      required: [key, label, unit, affects_readiness]
      properties:
        key: {type: string}
        label: {type: string}
        unit: {type: string}
        current: {type: number}
        previous: {type: number}
        baseline_7d: {type: number}
        baseline_28d: {type: number}
        delta_vs_7d: {type: number}
        delta_vs_28d: {type: number}
        affects_readiness: {type: boolean}
    ReadinessTimeline:
      type: object
      required: [date, score, status, previous_date, comparison_available, factors, health_trends, adaptation, summary]
      properties:
        date: {type: string, format: date}
        score: {type: integer, minimum: 0, maximum: 100}
        status:
          type: string
          enum: [ready, good, moderate, low]
        previous_date: {type: string, format: date}
        previous_score: {type: integer, minimum: 0, maximum: 100}
        score_delta: {type: integer}
        comparison_available: {type: boolean}
        factors:
          type: array
          items: {$ref: '#/components/schemas/ReadinessFactorImpact'}
        health_trends:
          type: array
          items: {$ref: '#/components/schemas/ReadinessHealthTrend'}
        adaptation: {$ref: '#/components/schemas/ReadinessAdaptationImpact'}
        summary:
          type: array
          items: {type: string}
    PoseLandmark:
      type: object
      required:
      - x
      - y
      - z
      - visibility
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
        visibility:
          type: number
          minimum: 0
          maximum: 1
    PoseFrame:
      type: object
      required:
      - timestamp_ms
      - landmarks
      properties:
        timestamp_ms:
          type: integer
          minimum: 0
        landmarks:
          type: array
          minItems: 33
          maxItems: 33
          items:
            $ref: '#/components/schemas/PoseLandmark'
    TechniqueAnalyzeInput:
      type: object
      required:
      - exercise_key
      - duration_ms
      - frames
      properties:
        exercise_key:
          type: string
          enum:
          - squat
          - biceps_curl
          - push_up
          - lunge
          - shoulder_press
        capture_mode:
          type: string
          enum:
          - recorded
          - live
          default: recorded
        workout_id:
          type: string
          format: uuid
        workout_exercise_id:
          type: string
          format: uuid
        set_number:
          type: integer
          minimum: 1
          maximum: 100
        duration_ms:
          type: integer
          minimum: 1
          maximum: 90000
        frames:
          type: array
          minItems: 8
          maxItems: 1200
          items:
            $ref: '#/components/schemas/PoseFrame'
    TechniqueRepMetric:
      type: object
      required:
      - number
      - start_ms
      - end_ms
      - duration_ms
      - eccentric_ms
      - concentric_ms
      - rom_degrees
      properties:
        number:
          type: integer
        start_ms:
          type: integer
        end_ms:
          type: integer
        duration_ms:
          type: integer
        eccentric_ms:
          type: integer
        concentric_ms:
          type: integer
        rom_degrees:
          type: number
        left_rom_degrees:
          type: number
        right_rom_degrees:
          type: number
        symmetry_delta_degrees:
          type: number
    TechniqueResult:
      type: object
      required:
      - id
      - exercise_key
      - exercise_name
      - capture_mode
      - rep_count
      - technique_score
      - rom_score
      - tempo_score
      - symmetry_score
      - stability_score
      - confidence
      - duration_ms
      - average_eccentric_ms
      - average_concentric_ms
      - average_rep_rpm
      - algorithm_version
      - reps
      - feedback
      - created_at
      properties:
        id:
          type: string
          format: uuid
        exercise_key:
          type: string
        exercise_name:
          type: string
        capture_mode:
          type: string
          enum:
          - recorded
          - live
        workout_id:
          type: string
          format: uuid
        workout_exercise_id:
          type: string
          format: uuid
        set_number:
          type: integer
        rep_count:
          type: integer
        technique_score:
          type: integer
          minimum: 0
          maximum: 100
        rom_score:
          type: integer
          minimum: 0
          maximum: 100
        tempo_score:
          type: integer
          minimum: 0
          maximum: 100
        symmetry_score:
          type: integer
          minimum: 0
          maximum: 100
        stability_score:
          type: integer
          minimum: 0
          maximum: 100
        confidence:
          type: number
          minimum: 0
          maximum: 1
        duration_ms:
          type: integer
        average_eccentric_ms:
          type: integer
        average_concentric_ms:
          type: integer
        average_rep_rpm:
          type: number
        algorithm_version:
          type: string
        reps:
          type: array
          items:
            $ref: '#/components/schemas/TechniqueRepMetric'
        feedback:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
    BodyScan:
