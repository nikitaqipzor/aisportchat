    AIChatRequest:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        history:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/AIChatMessage'
    AIChatResponse:
      type: object
      required:
      - message
      - model
      - provider
      properties:
        message:
