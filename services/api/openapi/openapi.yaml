        source:
          type: string
          enum:
          - text
          - image
        text:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/AIFoodDraftItem'
        warning:
          type: string
    AIFoodConfirmRequest:
      type: object
      required:
