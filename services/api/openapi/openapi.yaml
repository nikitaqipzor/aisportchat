          format: uuid
        scan_id:
          type: string
          format: uuid
        view:
          type: string
          enum:
          - front
          - side
          - back
        mime_type:
          type: string
          enum:
          - image/jpeg
          - image/png
        width:
          type: integer
        height:
          type: integer
        bytes:
          type: integer
        brightness:
          type: number
        contrast:
          type: number
        quality_status:
          type: string
          enum:
