        quantity_g:
          type: number
          exclusiveMinimum: 0
          maximum: 5000
        confidence:
          type: number
          minimum: 0
          maximum: 1
        notes:
          type: string
        matched_food:
          $ref: '#/components/schemas/FoodItem'
        match_quality:
